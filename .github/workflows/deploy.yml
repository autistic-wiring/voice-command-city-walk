name: Deploy to Server

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  build:
    runs-on: [self-hosted, k8s, nexvision]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 1

  deploy:
    needs: build
    runs-on: [self-hosted, k8s, nexvision]
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Deploy to server
        id: deploy
        run: |
          echo "Deploying to server..."
          # Add your deployment commands here
          # Example: cp -r dist/* /var/www/html/voice-command-city-walk/
          # Example: rsync -avz --delete dist/ user@server:/var/www/voice-command-city-walk/
          ls -la dist/
          echo "url=https://your-domain.com/voice-command-city-walk" >> $GITHUB_OUTPUT
          echo "✓ Deployment complete"

      - name: Verify deployment
        run: |
          echo "Verifying deployment..."
          # Add verification commands here
          # Example: curl -f https://your-domain.com/voice-command-city-walk/ || exit 1
          echo "✓ Verification complete"

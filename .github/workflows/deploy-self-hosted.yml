name: Deploy to Self-Hosted Server

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Install dependencies
        run: npm install
        
      - name: Build
        run: npm run build
        
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 1

  deploy:
    runs-on: self-hosted
    needs: build
    
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
          
      - name: Deploy to server
        run: |
          echo "Deploying to self-hosted server..."
          # Adjust the deploy path to your server setup
          # Example: rsync -avz --delete dist/ /var/www/voice-command-city-walk/
          # Or copy to nginx/html directory
          ls -la dist/
          echo "✓ Deployment complete"
        
      - name: Verify deployment
        run: |
          # Add verification steps here
          echo "Verifying deployment..."
          # Example: curl -f http://localhost/voice-command-city-walk/ || exit 1
          echo "✓ Verification complete"
